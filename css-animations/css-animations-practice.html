<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <style>
        .container {
            background-color: blue;
            height: 80vh;
            width: 30vw;
        }

        .box {
            /* The box needs a size, otherwise it stretches across the container */
            width: 60px;
            height: 60px;
            background-color: red;
            color: white;
            display: grid;
            place-items: center;

            /* animation shorthand order:
               name duration timing-function delay iteration-count direction fill-mode */
            animation:
                myAnimations 1s ease-in-out 1s 1 normal forwards,
                testAnimation 3s ease-in-out 3s 1 normal forwards;
        }

        @keyframes myAnimations {
            from {
                background-color: orange;
            }

            to {
                background-color: greenyellow;
                /* Use the separate `translate` property (not `transform`)
                   so it doesn't clash with the rotation below.
                   The distance keeps the box inside the container. */
                translate: calc(30vw - 60px) 0;
            }
        }

        @keyframes testAnimation {
            0% {
                rotate: 100deg;
            }

            20% {
                rotate: 200deg;
            }

            50% {
                rotate: 220deg;
                /* was: transform: deg(220deg) — invalid */
            }

            80% {
                rotate: 300deg;
            }

            100% {
                rotate: 360deg;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            Box
        </div>
    </div>
</body>

</html>
